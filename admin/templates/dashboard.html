<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmarTaste Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e4e4e7; min-height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid #27272a; background: #18181b; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .header h1 span { color: #a855f7; }
    .header-actions { display: flex; gap: 0.5rem; }
    .btn { padding: 0.4rem 0.75rem; border: 1px solid #27272a; border-radius: 6px; background: transparent; color: #a1a1aa; font-size: 0.75rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.375rem; }
    .btn:hover { border-color: #a855f7; color: #e4e4e7; }
    .btn-purple { background: #a855f7; border-color: #a855f7; color: white; }
    .btn-purple:hover { background: #9333ea; }
    .main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 1rem; }
    .card-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #71717a; margin-bottom: 0.25rem; }
    .card-value { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card-sub { font-size: 0.7rem; color: #52525b; margin-top: 0.125rem; }
    .section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #71717a; margin-bottom: 0.75rem; }
    .progress-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .progress-name { font-size: 0.8rem; font-weight: 500; width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .progress-bar-bg { flex: 1; height: 6px; background: #27272a; border-radius: 3px; overflow: hidden; }
    .progress-bar { height: 100%; background: #a855f7; border-radius: 3px; transition: width 0.5s; }
    .progress-pct { font-size: 0.7rem; font-variant-numeric: tabular-nums; color: #a1a1aa; width: 50px; text-align: right; }
    .error-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 6px; background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.1); margin-bottom: 0.375rem; font-size: 0.75rem; }
    .error-code { font-family: monospace; color: #ef4444; font-weight: 600; }
    .error-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error-time { color: #52525b; white-space: nowrap; }
    .loading { color: #52525b; font-size: 0.8rem; padding: 2rem; text-align: center; }
    .version { font-size: 0.7rem; color: #3f3f46; }
    @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1><span>Smar</span>Taste Admin</h1>
      <span class="version" id="version"></span>
    </div>
    <div class="header-actions">
      <a href="/nocodb" target="_blank" class="btn">NocoDB</a>
      <a href="/login" class="btn" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div class="main">
    <!-- Stat cards -->
    <div class="grid" id="stats">
      <div class="loading">Loading...</div>
    </div>

    <!-- Enrichment progress -->
    <div class="card" style="margin-bottom: 1.5rem;">
      <div class="section-title">Per-User Enrichment</div>
      <div id="progress"><div class="loading">Loading...</div></div>
    </div>

    <!-- Request stats -->
    <div class="grid" id="requestStats"></div>

    <!-- Recent errors -->
    <div class="card">
      <div class="section-title">Recent Errors</div>
      <div id="errors"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <script>
    // Auth is handled server-side — if we're here, we're authenticated

    // ── Render helpers ───────────────────────────────────
    function statCard(label, value, sub) {
      return `<div class="card"><div class="card-label">${label}</div><div class="card-value">${value}</div>${sub ? `<div class="card-sub">${sub}</div>` : ''}</div>`;
    }

    function progressRow(u) {
      return `<div class="progress-row"><span class="progress-name">${u.display_name}</span><div class="progress-bar-bg"><div class="progress-bar" style="width:${Math.min(100,u.percentage)}%"></div></div><span class="progress-pct">${u.enriched_songs}/${u.total_songs}</span></div><div style="font-size:0.65rem;color:#52525b;margin:-0.5rem 0 0.5rem 0;padding-left:128px">Library: ${u.library_songs} | Worker: ${u.worker_songs || 0} | Artists: ${u.unique_artists || '?'}</div>`;
    }

    function errorRow(err) {
      const time = err.timestamp ? new Date(err.timestamp).toLocaleTimeString() : '';
      return `<div class="error-row"><span class="error-code">${err.status_code}</span><span class="error-path">${err.method} ${err.path}</span><span class="error-time">${err.duration_ms}ms</span><span class="error-time">${time}</span></div>`;
    }

    // ── Data fetching ────────────────────────────────────
    async function fetchData() {
      try {
        const [statusResp, progressResp, reqStatsResp, errorsResp] = await Promise.all([
          fetch('/api/admin/status', { credentials: 'include' }),
          fetch('/api/admin/progress', { credentials: 'include' }),
          fetch('/api/admin/request-stats', { credentials: 'include' }),
          fetch('/api/admin/errors?limit=20', { credentials: 'include' }),
        ]);

        // Status cards
        if (statusResp.ok) {
          const s = await statusResp.json();
          document.getElementById('version').textContent = `v${s.version}`;
          document.getElementById('stats').innerHTML = [
            statCard('Users', s.users, `${s.calibrated_users} calibrated`),
            statCard('Connections', s.connections, ''),
            statCard('Songs', s.total_songs.toLocaleString(), `${s.total_enriched.toLocaleString()} enriched`),
            statCard('Enrichment', `${s.enrichment_pct}%`, s.soundstat_configured ? 'SoundStat active' : 'Free tier'),
            statCard('ISRC Cache', s.global_isrc_cache.toLocaleString(), 'Global shared'),
            statCard('History', s.listening_history_entries.toLocaleString(), 'Entries'),
          ].join('');
        }

        // Enrichment progress
        if (progressResp.ok) {
          const p = await progressResp.json();
          if (p.users && p.users.length > 0) {
            document.getElementById('progress').innerHTML = p.users.map(u =>
              progressRow(u)
            ).join('');
          } else {
            document.getElementById('progress').innerHTML = '<div class="loading">No users with songs</div>';
          }
        }

        // Request stats
        if (reqStatsResp.ok) {
          const r = await reqStatsResp.json();
          const rs = r.stats || {};
          document.getElementById('requestStats').innerHTML = [
            statCard('Requests Today', (rs.total_today || 0).toLocaleString(), `avg ${rs.avg_duration_ms || 0}ms`),
            statCard('Errors Today', rs.errors_today || 0, `${rs.slow_requests_today || 0} slow (>5s)`),
          ].join('');
        }

        // Errors
        if (errorsResp.ok) {
          const e = await errorsResp.json();
          if (e.errors && e.errors.length > 0) {
            document.getElementById('errors').innerHTML = e.errors.map(errorRow).join('');
          } else {
            document.getElementById('errors').innerHTML = '<div class="loading">No errors</div>';
          }
        }
      } catch (err) {
        console.error('Failed to fetch admin data:', err);
      }
    }

    // ── Init ─────────────────────────────────────────────
    (async () => {
      await fetchData();
      setInterval(fetchData, 30000);
    })();
  </script>
</body>
</html>
