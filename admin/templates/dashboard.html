<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmarTaste Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1E40AF;
      --primary-light: #3B82F6;
      --primary-bg: #EFF6FF;
      --accent: #D97706;
      --accent-bg: #FFFBEB;
      --success: #16A34A;
      --success-bg: #F0FDF4;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --purple: #7C3AED;
      --purple-bg: #F5F3FF;
      --bg: #F1F5F9;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    .header h1 { font-size: 1.125rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .header h1 span { color: var(--purple); }
    .version {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--border-light);
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
    }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .refresh-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    .refresh-label { font-size: 0.6875rem; color: var(--text-muted); margin-right: 0.5rem; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn {
      padding: 0.4375rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      transition: all 150ms ease;
    }
    .btn:hover { border-color: var(--primary-light); color: var(--primary); background: var(--primary-bg); }
    .btn:focus-visible { outline: 2px solid var(--primary-light); outline-offset: 2px; }
    .btn svg { width: 14px; height: 14px; }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }

    /* ── Main ─────────────────────────────────────── */
    .main { padding: 1.5rem; max-width: 1280px; margin: 0 auto; }

    /* ── KPI Grid ─────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.125rem 1.25rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 150ms ease, border-color 150ms ease;
    }
    .kpi-card:hover { box-shadow: var(--shadow); border-color: #CBD5E1; }
    .kpi-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.625rem; }
    .kpi-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }
    .kpi-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .kpi-icon svg { width: 16px; height: 16px; }
    .kpi-icon.blue { background: var(--primary-bg); color: var(--primary); }
    .kpi-icon.purple { background: var(--purple-bg); color: var(--purple); }
    .kpi-icon.amber { background: var(--accent-bg); color: var(--accent); }
    .kpi-icon.green { background: var(--success-bg); color: var(--success); }
    .kpi-icon.red { background: var(--danger-bg); color: var(--danger); }
    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .kpi-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-variant-numeric: tabular-nums;
    }

    /* ── Section ──────────────────────────────────── */
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-title svg { width: 16px; height: 16px; color: var(--text-secondary); }
    .section-badge {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }
    .badge-blue { background: var(--primary-bg); color: var(--primary); }
    .badge-red { background: var(--danger-bg); color: var(--danger); }
    .badge-green { background: var(--success-bg); color: var(--success); }

    /* ── Progress ─────────────────────────────────── */
    .progress-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-light);
    }
    .progress-item:last-child { border-bottom: none; padding-bottom: 0; }
    .progress-item:first-child { padding-top: 0; }
    .progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .progress-name { font-size: 0.8125rem; font-weight: 600; color: var(--text); }
    .progress-ratio { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .progress-bar-track { width: 100%; height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .progress-bar-fill.low { background: linear-gradient(90deg, var(--danger), #F87171); }
    .progress-bar-fill.mid { background: linear-gradient(90deg, var(--accent), #FBBF24); }
    .progress-bar-fill.high { background: linear-gradient(90deg, var(--success), #4ADE80); }
    .progress-bar-fill.full { background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
    .progress-meta {
      display: flex;
      gap: 1rem;
      margin-top: 0.375rem;
      font-size: 0.6875rem;
      color: var(--text-muted);
    }
    .progress-meta span { display: inline-flex; align-items: center; gap: 0.25rem; }

    /* ── Inline Stats Row ─────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.875rem;
      margin-bottom: 1.25rem;
    }

    /* ── Errors ───────────────────────────────────── */
    .error-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.375rem;
      font-size: 0.8125rem;
      background: var(--danger-bg);
      border: 1px solid #FECACA;
      transition: background 150ms ease;
    }
    .error-item:last-child { margin-bottom: 0; }
    .error-item:hover { background: #FEE2E2; }
    .error-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--danger);
      background: var(--card);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      border: 1px solid #FECACA;
    }
    .error-method {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .error-path {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .error-duration {
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .error-time {
      font-size: 0.6875rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Empty / Loading ──────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
    .empty-state svg { width: 32px; height: 32px; color: var(--border); margin-bottom: 0.5rem; }

    .loading-skeleton {
      background: linear-gradient(90deg, var(--border-light) 25%, #E2E8F0 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: var(--radius-sm);
      height: 1rem;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Footer ───────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.6875rem;
      color: var(--text-muted);
    }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 640px) {
      .main { padding: 1rem; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 0.625rem; }
      .kpi-card { padding: 0.875rem; }
      .kpi-value { font-size: 1.5rem; }
      .stats-row { grid-template-columns: 1fr; }
      .header { padding: 0.75rem 1rem; }
      .header h1 { font-size: 1rem; }
      .error-item { flex-wrap: wrap; gap: 0.375rem; }
      .error-path { min-width: 100%; order: 10; }
    }

    @media (max-width: 400px) {
      .kpi-grid { grid-template-columns: 1fr; }
    }

    /* ── Reduced motion ──────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .progress-bar-fill { transition: none; }
      .refresh-dot { animation: none; }
      .loading-skeleton { animation: none; }
      .kpi-card, .btn, .error-item { transition: none; }
    }
  </style>
</head>

  <div class="main">

    </div>

    <!-- Request Stats -->
    <div class="stats-row" id="requestStats"></div>

    <!-- Enrichment Progress -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zM6 8a2 2 0 11-4 0 2 2 0 014 0zM1.49 15.326a.78.78 0 01-.358-.442 3 3 0 014.308-3.516 6.484 6.484 0 00-1.905 3.959c-.023.222-.014.442.025.654a4.97 4.97 0 01-2.07-.655zM16.44 15.98a4.97 4.97 0 002.07-.654.78.78 0 00.357-.442 3 3 0 00-4.308-3.517 6.484 6.484 0 011.907 3.96 2.32 2.32 0 01-.026.654zM18 8a2 2 0 11-4 0 2 2 0 014 0zM5.304 16.19a.844.844 0 01-.277-.71 5 5 0 019.947 0 .843.843 0 01-.277.71A6.975 6.975 0 0110 18a6.974 6.974 0 01-4.696-1.81z"/></svg>
          Per-User Enrichment

        <span class="section-badge badge-blue" id="userCount"></span>
      </div>
      <div id="progress">
        <div class="empty-state">Loading enrichment data...</div>
      </div>
    </div>

    <!-- Recent Errors -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
          Recent Errors

        <span class="section-badge badge-red" id="errorCount"></span>
      </div>
      <div id="errors">
        <div class="empty-state">Loading error data...</div>
      </div>
    </div>
  </div>

  <div class="footer">
    SmarTaste Admin &middot; Auto-refreshes every 30s
  </div>

      cache: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M4.5 2A1.5 1.5 0 003 3.5v13A1.5 1.5 0 004.5 18h11a1.5 1.5 0 001.5-1.5V7.621a1.5 1.5 0 00-.44-1.06l-4.12-4.122A1.5 1.5 0 0011.378 2H4.5zm2.25 8.5a.75.75 0 000 1.5h6.5a.75.75 0 000-1.5h-6.5zm0 3a.75.75 0 000 1.5h6.5a.75.75 0 000-1.5h-6.5z"/></svg>',
      history: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm.75-13a.75.75 0 00-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 000-1.5h-3.25V5z" clip-rule="evenodd"/></svg>',
      requests: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 1a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 1zM5.05 3.05a.75.75 0 011.06 0l1.062 1.06a.75.75 0 11-1.06 1.06L5.05 4.11a.75.75 0 010-1.06zm9.9 0a.75.75 0 010 1.06l-1.06 1.06a.75.75 0 01-1.062-1.06l1.061-1.06a.75.75 0 011.06 0zM10 7a3 3 0 100 6 3 3 0 000-6zm-6.25 2.25a.75.75 0 010 1.5h-1.5a.75.75 0 010-1.5h1.5zm14.5 0a.75.75 0 010 1.5h-1.5a.75.75 0 010-1.5h1.5zM5.11 14.95a.75.75 0 011.062 0l1.06 1.06a.75.75 0 01-1.06 1.06l-1.06-1.06a.75.75 0 010-1.06zm8.84 0a.75.75 0 011.06 1.06l-1.06 1.06a.75.75 0 11-1.061-1.06l1.06-1.06zM10 16a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 16z" clip-rule="evenodd"/></svg>',
      errors: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>',
    };

    // ── Render helpers ──────────────────────────────
    function kpiCard(label, value, sub, iconKey, colorClass) {
      return `<div class="kpi-card">
        <div class="kpi-header">
          <span class="kpi-label">${label}</span>
          <div class="kpi-icon ${colorClass}">${icons[iconKey]}</div>
        </div>
        <div class="kpi-value">${value}</div>
        ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
      </div>`;
    }

    function progressBar(pct) {
      const cls = pct >= 100 ? 'full' : pct >= 70 ? 'high' : pct >= 30 ? 'mid' : 'low';
      return `<div class="progress-bar-track"><div class="progress-bar-fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div>`;
    }

    function progressItem(u) {
      const pct = u.percentage || 0;
      return `<div class="progress-item">
        <div class="progress-top">
          <span class="progress-name">${u.display_name}</span>
          <span class="progress-ratio">${u.enriched_songs}/${u.total_songs} <span style="color:var(--text-muted)">(${pct}%)</span></span>
        </div>
        ${progressBar(pct)}
        <div class="progress-meta">
          <span>${icons.songs.replace('viewBox', 'width="12" height="12" viewBox')} Library: ${u.library_songs}</span>
          <span>Worker: ${u.worker_songs || 0}</span>
          <span>Artists: ${u.unique_artists || '?'}</span>
        </div>
      </div>`;
    }

    function errorItem(err) {
      const time = err.timestamp ? new Date(err.timestamp).toLocaleTimeString() : '';
      return `<div class="error-item">
        <span class="error-code">${err.status_code}</span>
        <span class="error-method">${err.method}</span>
        <span class="error-path">${err.path}</span>
        <span class="error-duration">${err.duration_ms}ms</span>
        <span class="error-time">${time}</span>
      </div>`;
    }

    function emptyState(text) {
      return `<div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd"/></svg>
        <div>${text}</div>
      </div>`;
    }

    // ── Data fetching ─────────────────────────────────
    async function fetchData() {
      try {
        const [statusResp, progressResp, reqStatsResp, errorsResp] = await Promise.all([
          fetch('/api/admin/status', { credentials: 'include' }),
          fetch('/api/admin/progress', { credentials: 'include' }),
          fetch('/api/admin/request-stats', { credentials: 'include' }),
          fetch('/api/admin/errors?limit=20', { credentials: 'include' }),
        ]);

        // Status cards
        if (statusResp.ok) {
          const s = await statusResp.json();
          document.getElementById('version').textContent = `v${s.version}`;
          document.getElementById('stats').innerHTML = [
            kpiCard('Users', s.users, `${s.calibrated_users} calibrated`, 'users', 'blue'),
            kpiCard('Connections', s.connections, '', 'connections', 'purple'),
            kpiCard('Songs', s.total_songs.toLocaleString(), `${s.total_enriched.toLocaleString()} enriched`, 'songs', 'green'),
            kpiCard('Enrichment', `${s.enrichment_pct}%`, s.soundstat_configured ? 'SoundStat active' : 'Free tier', 'enrichment', 'amber'),
            kpiCard('ISRC Cache', s.global_isrc_cache.toLocaleString(), 'Global shared', 'cache', 'blue'),
            kpiCard('History', s.listening_history_entries.toLocaleString(), 'Entries', 'history', 'purple'),
          ].join('');
        }

        // Request stats
        if (reqStatsResp.ok) {
          const r = await reqStatsResp.json();
          const rs = r.stats || {};
          document.getElementById('requestStats').innerHTML = [
            kpiCard('Requests Today', (rs.total_today || 0).toLocaleString(), `avg ${rs.avg_duration_ms || 0}ms`, 'requests', 'green'),
            kpiCard('Errors Today', rs.errors_today || 0, `${rs.slow_requests_today || 0} slow (>5s)`, 'errors', 'red'),
          ].join('');
        }

        // Enrichment progress
        if (progressResp.ok) {
          const p = await progressResp.json();
          const el = document.getElementById('progress');
          const badge = document.getElementById('userCount');
          if (p.users && p.users.length > 0) {
            el.innerHTML = p.users.map(progressItem).join('');
            badge.textContent = `${p.users.length} user${p.users.length !== 1 ? 's' : ''}`;
            badge.className = 'section-badge badge-blue';
          } else {
            el.innerHTML = emptyState('No users with songs yet');
            badge.textContent = '0';
          }
        }

        // Errors
        if (errorsResp.ok) {
          const e = await errorsResp.json();
          const el = document.getElementById('errors');
          const badge = document.getElementById('errorCount');
          if (e.errors && e.errors.length > 0) {
            el.innerHTML = e.errors.map(errorItem).join('');
            badge.textContent = e.errors.length;
            badge.className = 'section-badge badge-red';
          } else {
            el.innerHTML = emptyState('No errors \u2014 looking good!');
            badge.textContent = '0';
            badge.className = 'section-badge badge-green';
          }
        }
      } catch (err) {
        console.error('Failed to fetch admin data:', err);
      }
    }

    // ── Logout ──────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/login';
    });

    // ── Init ────────────────────────────────────────
    (async () => {
      await fetchData();
      setInterval(fetchData, 30000);
    })();
  </script>
</body>
</html>
